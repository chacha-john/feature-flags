# Namespaced (not cluster-wide) store: only this namespace can read through it.
# Authenticates as the `eso-reader` service account, which Terraform annotated with the IRSA role
# that may read the one DB secret.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: feature-flags
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}
      auth:
        jwt:
          serviceAccountRef:
            name: eso-reader
