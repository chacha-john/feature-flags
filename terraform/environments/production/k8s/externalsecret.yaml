# Materialises SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD as a Kubernetes Secret from
# the RDS-managed Secrets Manager secret. Nothing sensitive is written in this file: DB_SECRET_ARN is
# only a pointer (`terraform output -raw db_secret_arn`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: feature-flags-db
  namespace: feature-flags
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: feature-flags-db
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: ${DB_SECRET_ARN}
        property: username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: ${DB_SECRET_ARN}
        property: password
